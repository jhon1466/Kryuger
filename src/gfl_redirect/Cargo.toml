[package]
name = "version"
version = "0.1.0"
edition = "2021"

[lib]
name = "version"
crate-type = ["cdylib"]

[dependencies]
minhook = "0.7"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemServices",
    "Win32_Networking_WinSock",
    "Win32_Storage_FileSystem"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
